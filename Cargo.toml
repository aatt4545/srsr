[package]
name = "deobfuscator-engine"
version = "1.0.0"
edition = "2021"

[dependencies]
regex = "1.10"
base64 = "0.21"
hex = "0.4"
urlencoding = "2.1"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[lib]
name = "deobfuscator"
crate-type = ["cdylib", "rlib"]

[package]
name = "ransomware"
version = "1.0.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
rand = "0.8"
dirs = "5.0"
walkdir = "2.4"
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde_json = "1.0"
base64 = "0.21"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
strip = true
lto = true
panic = "abort"

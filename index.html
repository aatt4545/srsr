<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deobfuscator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #ddd;
            font-family: monospace;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: normal;
        }
        .section {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: #aaa;
        }
        textarea {
            width: 100%;
            height: 300px;
            background: #000;
            color: #ddd;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            outline: none;
        }
        textarea:focus { border-color: #555; }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #000;
            color: #ddd;
            border: 1px solid #333;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            margin-bottom: 10px;
            outline: none;
        }
        select {
            width: 100%;
            padding: 10px;
            background: #000;
            color: #ddd;
            border: 1px solid #333;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            margin-bottom: 10px;
            outline: none;
        }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .row > div { flex: 1; }
        button {
            width: 100%;
            padding: 14px;
            background: #222;
            color: #ddd;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            font-size: 15px;
        }
        button:hover { background: #333; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status {
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
        }
        .divider {
            text-align: center;
            margin: 20px 0;
            color: #555;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Deobfuscator</h1>
        
        <div class="section">
            <div class="row">
                <div>
                    <label>Language</label>
                    <select id="language">
                        <option value="">Auto Detect</option>
                        <option value="javascript">JavaScript</option>
                        <option value="typescript">TypeScript</option>
                        <option value="lua">Lua</option>
                        <option value="python">Python</option>
                        <option value="php">PHP</option>
                        <option value="ruby">Ruby</option>
                        <option value="perl">Perl</option>
                        <option value="c">C</option>
                        <option value="cpp">C++</option>
                        <option value="csharp">C#</option>
                        <option value="java">Java</option>
                        <option value="kotlin">Kotlin</option>
                        <option value="swift">Swift</option>
                        <option value="go">Go</option>
                        <option value="rust">Rust</option>
                        <option value="shell">Shell</option>
                        <option value="powershell">PowerShell</option>
                        <option value="sql">SQL</option>
                        <option value="html">HTML</option>
                        <option value="json">JSON</option>
                        <option value="xml">XML</option>
                    </select>
                </div>
                <div>
                    <label>Obfuscation Type</label>
                    <select id="obfuscationType">
                        <option value="">Auto Detect</option>
                        <option value="base64">Base64</option>
                        <option value="hex_escape">Hex Escape</option>
                        <option value="unicode_escape">Unicode Escape</option>
                        <option value="octal_escape">Octal Escape</option>
                        <option value="urlencode">URL Encoding</option>
                        <option value="rot13">ROT13</option>
                        <option value="xor">XOR</option>
                        <option value="string_concat">String Concatenation</option>
                        <option value="reverse">Reverse String</option>
                        <option value="dead_code">Dead Code</option>
                        <option value="js_charcode">String.fromCharCode</option>
                        <option value="js_string_array">String Array (JS)</option>
                        <option value="js_control_flow">Control Flow (JS)</option>
                        <option value="js_var_rename">Variable Rename</option>
                        <option value="js_eval">eval (JS)</option>
                        <option value="lua_charcode">string.char (Lua)</option>
                        <option value="lua_loadstring">loadstring (Lua)</option>
                        <option value="lua_string_array">String Array (Lua)</option>
                        <option value="py_exec">exec (Python)</option>
                        <option value="py_eval">eval (Python)</option>
                        <option value="py_lambda">lambda (Python)</option>
                        <option value="py_marshal">marshal (Python)</option>
                        <option value="php_eval">eval (PHP)</option>
                        <option value="php_gzinflate">gzinflate (PHP)</option>
                        <option value="php_gzuncompress">gzuncompress (PHP)</option>
                        <option value="php_str_rot13">str_rot13 (PHP)</option>
                        <option value="ruby_eval">eval (Ruby)</option>
                        <option value="shell_eval">eval (Shell)</option>
                        <option value="sql_hex">Hex (SQL)</option>
                        <option value="sql_char">CHAR (SQL)</option>
                    </select>
                </div>
            </div>
            
            <label>URL</label>
            <input type="text" id="url" placeholder="https://raw.githubusercontent.com/...">
            
            <div class="divider">or</div>
            
            <label>File</label>
            <input type="file" id="fileInput" accept=".js,.ts,.lua,.py,.php,.rb,.pl,.c,.cpp,.cs,.java,.kt,.swift,.go,.rs,.sh,.ps1,.sql,.html,.json,.xml,.txt">
            
            <div class="divider">or</div>
            
            <label>Obfuscated Code</label>
            <textarea id="input" placeholder="Paste code here..."></textarea>
            
            <button id="btn" onclick="deobfuscate()">Deobfuscate</button>
            
            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
        async function deobfuscate() {
            const url = document.getElementById('url').value;
            const fileInput = document.getElementById('fileInput');
            const code = document.getElementById('input').value;
            const language = document.getElementById('language').value;
            const obfuscationType = document.getElementById('obfuscationType').value;
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.textContent = 'Processing...';
            status.textContent = '...';
            
            try {
                let response;
                
                if (fileInput.files.length > 0) {
                    const formData = new FormData();
                    formData.append('file', fileInput.files[0]);
                    formData.append('language', language);
                    formData.append('obfuscation_type', obfuscationType);
                    
                    response = await fetch('/api/deobfuscate/file', {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    response = await fetch('/api/deobfuscate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            code,
                            url,
                            language,
                            obfuscation_type: obfuscationType
                        })
                    });
                }
                
                if (response.ok) {
                    const blob = await response.blob();
                    const downloadUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    
                    const disposition = response.headers.get('Content-Disposition');
                    if (disposition && disposition.includes('filename=')) {
                        a.download = disposition.split('filename=')[1];
                    } else {
                        a.download = 'deobfuscated.zip';
                    }
                    
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(downloadUrl);
                    
                    status.textContent = 'done';
                } else {
                    const error = await response.json();
                    status.textContent = 'error: ' + (error.error || 'unknown');
                }
                
            } catch(e) {
                status.textContent = e.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Deobfuscate';
            }
        }
    </script>
</body>
</html>
